name: R0 checkpoint validation

on:
  push:
    branches:
      - implement/r0-software-platform-registries
  workflow_dispatch:

jobs:
  r0:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - name: Checkout R0 implementation branch
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.11
      - name: Install TeAL with test dependencies
        run: uv sync --python 3.11 --all-extras
      - name: Compile modified registry modules
        run: uv run python -m compileall -q src/text_analysis_lab/core
      - name: Focused R0 registry and provenance tests
        run: uv run pytest -q tests/test_environment_registry.py tests/test_operation_environment_provenance.py tests/test_platform_registry.py
      - name: Full test suite
        run: uv run pytest -q
