name: Real GeCo integration (manual)

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      ref_note:
        description: "Optional reason for running the real GeCo round-trip"
        required: false
        default: "manual verification"

jobs:
  real-geco-roundtrip:
    # Only an explicitly added PR label or an on-demand workflow dispatch runs this.
    # Ordinary push/PR-update CI never invokes the persisted cross-project smoke.
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-real-geco'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.11
      - name: Install TeAL with GeCo
        run: uv sync --python 3.11 --all-extras
      - name: Verify persisted TeAL-GeCo round-trip
        env:
          TEAL_RUN_REAL_GECO: "1"
        run: uv run pytest tests/test_geco_real_optin.py -q -rs
