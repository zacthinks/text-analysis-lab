name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Install TeAL and all dependencies
        run: uv sync --python 3.11 --all-extras

      - name: Check version metadata
        run: uv run python scripts/check_version.py

      - name: Run pytest (2 workers)
        # Keep all test files selected; distribute independent files across workers.
        # CI-only xdist overlay leaves local pytest and the uv lockfile unchanged.
        run: uv run --with pytest-xdist==3.8.0 pytest -n 2 --dist=loadfile -q -rs --durations=30
