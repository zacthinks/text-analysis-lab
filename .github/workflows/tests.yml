name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install TeAL and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[visualization,transformers,linguistics]" pytest

      - name: Run pytest
        run: pytest -q
