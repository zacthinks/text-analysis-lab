name: R2 Managed uv smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feature/platforms-and-environments
    paths:
      - src/text_analysis_lab/core/managed_environments.py
      - src/text_analysis_lab/core/environments.py
      - src/text_analysis_lab/core/secondary_coordinator.py
      - tests/test_managed_environments.py
      - .github/workflows/managed-uv-r2.yml

jobs:
  managed-base:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Install exact Python for managed test
        run: uv python install 3.11.15
      - name: Install local editable parent and test dependencies
        shell: bash
        run: |
          uv venv --python 3.11.15 .venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "PYTHON_EXE=.venv/Scripts/python.exe" >> "$GITHUB_ENV"
            uv pip install --python .venv/Scripts/python.exe -e . pytest
          else
            echo "PYTHON_EXE=.venv/bin/python" >> "$GITHUB_ENV"
            uv pip install --python .venv/bin/python -e . pytest
          fi
      - name: Real standalone managed child and R1 delegation
        shell: bash
        env:
          TEAL_RUN_MANAGED_INSTALL_ACCEPTANCE: "1"
        run: |
          "$PYTHON_EXE" -m pytest --acceptance tests/test_managed_environments.py -m acceptance -q -rs
