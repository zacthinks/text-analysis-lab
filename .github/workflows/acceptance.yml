name: Acceptance

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - refactor/standalone-translators

jobs:
  acceptance:
    name: acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Install TeAL and all dependencies
        run: uv sync --python 3.11 --all-extras

      - name: Run acceptance tests
        run: uv run pytest --acceptance -m acceptance -q -rs
